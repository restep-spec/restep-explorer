<!doctype html>
<html lang="{{=lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{pageDescription}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ff6a3d">
<meta name="referrer" content="no-referrer">
<link rel="canonical" href="{{=url}}">
<link rel="alternate" hreflang="en" href="{{=urlEn}}">
<link rel="alternate" hreflang="es" href="{{=urlEs}}">
<link rel="alternate" hreflang="x-default" href="{{=urlEn}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Restep · wubytes">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
<meta property="og:url" content="{{=url}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:image" content="{{=ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{=assets}}explorer.css">
<script src="{{=assets}}explorer-theme.js"></script>
<script src="{{=assets}}explorer-i18n.js" defer></script>
<script src="{{=assets}}explorer-logic.js" defer></script>
<script src="{{=assets}}explorer.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-go" viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H6M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></symbol>
  <symbol id="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
</svg>
<a class="skip" href="#main">{{skip}}</a>
<div class="wrap">
<header class="site">
  <a class="brand" href="{{=home}}"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="37" height="37" rx="5" fill="#ff6a3d" stroke="#161616" stroke-width="3"/><path d="M8 31h8v-7h7v-7h7v-7" fill="none" stroke="#161616" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/></svg>Restep<small>2½</small></a>
  <nav aria-label="{{navLabel}}"><a href="{{=home}}">{{navOverview}}</a><a href="{{=spec}}">{{navSpec}}</a><a href="{{=tools}}">{{navTools}}</a><a href="{{=self}}" aria-current="page">{{navExplorer}}</a><a href="/ref/restep-server.mjs">{{navRef}}</a><a class="lang" id="other-lang" href="{{=otherPath}}" hreflang="{{=otherLang}}" lang="{{=otherLang}}">{{otherLang}}</a></nav>
  <div class="tools"><button type="button" class="btn small" id="theme"></button></div>
</header>

<main id="main">
  <h1 class="sr">Restep Explorer</h1>
  <form id="connect" class="ink" novalidate>
    <div class="row">
      <div class="grow">
        <label for="api-url">{{apiUrlLabel}}</label>
        <input id="api-url" name="api" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="{{apiUrlPlaceholder}}" value="https://demo.restep.wubytes.com/" required>
      </div>
      <button class="btn hot" type="submit"><svg class="i" aria-hidden="true"><use href="#i-go"/></svg>{{explore}}</button>
    </div>
    <details id="settings">
      <summary>{{settingsSummary}}</summary>
      <div class="row">
        <div class="grow">
          <label for="token">{{tokenLabel}}</label>
          <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="token-hint">
        </div>
        <button class="btn" type="button" id="token-save"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>{{tokenUse}}</button>
        <button class="btn" type="button" id="token-forget">{{tokenForget}}</button>
      </div>
      <p class="hint" id="token-hint">{{{tokenHintHtml}}}</p>
      <div class="row mt10">
        <div class="grow">
          <label for="lang">{{langLabel}}</label>
          <input id="lang" type="text" autocomplete="off" spellcheck="false" placeholder="{{langPlaceholder}}" aria-describedby="lang-hint">
        </div>
        <button class="btn" type="button" id="lang-save">{{langApply}}</button>
      </div>
      <p class="hint" id="lang-hint">{{langHint}}</p>
    </details>
  </form>

  <form id="pathbar" hidden novalidate>
    <div class="grow">
      <label for="path">{{pathLabel}}</label>
      <input id="path" type="text" spellcheck="false" autocomplete="off" placeholder="/books?sort=-price">
    </div>
    <button class="btn" type="submit"><svg class="i" aria-hidden="true"><use href="#i-go"/></svg>{{go}}</button>
    <button class="btn" type="button" id="reload"><svg class="i" aria-hidden="true"><use href="#i-reload"/></svg>{{reload}}</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <div class="layout" id="layout" hidden>
    <nav id="side" class="ink" aria-labelledby="side-h"></nav>
    <div id="view" tabindex="-1"></div>
  </div>
  <div id="welcome"></div>

  <section id="log" aria-labelledby="log-h" hidden>
    <h2 id="log-h">{{logTitle}}</h2>
    <p class="hint">{{logHint}}</p>
    <div id="log-list"></div>
  </section>
</main>

<footer class="site">
  <p>{{{footerHtml}}}</p>
</footer>
</div>
</body>
</html>
